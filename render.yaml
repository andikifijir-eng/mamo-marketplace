services:
  - type: web
    name: mamo-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: cd server && npm install && npx prisma generate
    startCommand: cd server && node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: PORT
        value: 10000
      - key: UPLOAD_DIR
        value: uploads
      - key: MAX_UPLOAD_MB
        value: 5
